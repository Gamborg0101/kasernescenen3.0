services:
  db:
    image: postgres:18.3
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kasernescenen
    ports:
      - 5432:5432
    healthcheck: 
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
      
    
